name: Build Faustix ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Faustix
        uses: actions/checkout@v4

      - name: Traiter les images (auto-détection)
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

          IMGS=$(find assets -type f \( -iname '*.png' -o -iname '*.jpg' \
                 -o -iname '*.jpeg' -o -iname '*.webp' \))
          N=$(echo "$IMGS" | grep -c .)
          echo "Images trouvées : $N"
          if [ "$N" -lt 2 ]; then
            echo "::error::Il faut au moins 2 images dans assets/ (wallpaper + icône)"
            exit 1
          fi

          # Plus volumineux = wallpaper, plus léger = icône diablotin
          WALL=$(echo "$IMGS" | xargs -I{} stat -c '%s {}' {} | sort -rn | head -1 | cut -d' ' -f2-)
          DEMON=$(echo "$IMGS" | xargs -I{} stat -c '%s {}' {} | sort -n  | head -1 | cut -d' ' -f2-)
          echo "Wallpaper : $WALL"
          echo "Diablotin : $DEMON"

          # Destinations
          mkdir -p overlay-root/usr/share/icons/hicolor/512x512/apps \
                   overlay-root/usr/share/icons/hicolor/48x48/apps \
                   overlay-root/usr/share/plymouth/themes/faustix \
                   overlay-root/usr/share/sddm/themes/faustix \
                   overlay-root/etc/fastfetch \
                   overlay-root/usr/share/wallpapers/faustix/contents/images

          # Diablotin : fond blanc -> transparent, puis décliné partout
          convert "$DEMON" -fuzz 12% -transparent white \
            overlay-root/usr/share/icons/hicolor/512x512/apps/faustix.png
          convert "$DEMON" -fuzz 12% -transparent white -resize 48x48 \
            overlay-root/usr/share/icons/hicolor/48x48/apps/faustix.png
          convert "$DEMON" -fuzz 12% -transparent white \
            overlay-root/etc/fastfetch/logo.png
          convert "$DEMON" -fuzz 12% -transparent white \
            overlay-root/usr/share/plymouth/themes/faustix/demon-512.png
          convert "$DEMON" -fuzz 12% -transparent white \
            overlay-root/usr/share/sddm/themes/faustix/demon-512.png

          # Wallpaper (converti en JPG quelle que soit son origine)
          convert "$WALL" -quality 88 \
            overlay-root/usr/share/wallpapers/faustix/contents/images/faustix.jpg

      - name: Construire l'overlay apkovl
        run: |
          chmod +x profile/genapkovl-faustix.sh
          ./profile/genapkovl-faustix.sh

      - name: Build ISO dans le conteneur Alpine
        run: |
          docker run --rm -v "$PWD:/work" alpine:3.21 /bin/sh -exc '
                      apk add --no-cache bash git xorriso squashfs-tools \
              mkinitfs mtools dosfstools syslinux \
              abuild
                          git clone --depth 1 --branch 3.21-stable \
              https://github.com/alpinelinux/aports.git /tmp/aports
            cp /work/profile/mkimg.faustix.sh /tmp/aports/scripts/
            chmod +x /tmp/aports/scripts/mkimg.faustix.sh
            sh /tmp/aports/scripts/mkimage.sh \
              --tag faustix \
              --outdir /work/out \
              --arch x86_64 \
              --apkovl /work/faustix.apkovl.tar.gz \
              --profile faustix
          '

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: faustix-iso
          path: out/*.iso
